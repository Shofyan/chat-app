name: ruang-chat
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_local_password}
      POSTGRES_DB: chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD:-chat_local_password}@db:5432/chat?sslmode=disable
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true
    restart: unless-stopped
volumes:
  postgres_data:
